name: Build

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Install .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Download Dalamud
      shell: pwsh
      run: |
        Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
        Expand-Archive -Force latest.zip "$env:APPDATA\XIVLauncher\addon\Hooks\dev"

    - name: Build plugin
      run: dotnet build XFC-Fight-Tracker.slnx --configuration Release

    - name: Store plugin artifacts
      uses: actions/upload-artifact@v4
      with:
        name: XFC-Fight-Tracker
        path: XFC-Fight-Tracker/bin/x64/Release/XFC-Fight-Tracker/*
        if-no-files-found: error
        retention-days: 7

  test:
    # The match engine and roll parser have no Dalamud dependency, so the rules
    # tests run on plain Linux without the game libraries.
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Install .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Run rules tests
      run: dotnet run --project XFCFightTracker.Tests/XFCFightTracker.Tests.csproj
