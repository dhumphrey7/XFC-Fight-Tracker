name: Build

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Install .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Download Dalamud
      shell: pwsh
      run: |
        Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
        Expand-Archive -Force latest.zip "$env:APPDATA\XIVLauncher\addon\Hooks\dev"

    - name: Build plugin
      run: dotnet build XFC-Fight-Tracker.slnx --configuration Release

    - name: Store plugin artifacts
      uses: actions/upload-artifact@v4
      with:
        name: XFC-Fight-Tracker
        path: XFC-Fight-Tracker/bin/x64/Release/XFC-Fight-Tracker/*
        if-no-files-found: error
        retention-days: 7

  test:
    # The match engine and roll parser have no Dalamud dependency, so the rules
    # tests run on plain Linux without the game libraries.
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Install .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Run rules tests
      run: dotnet run --project XFCFightTracker.Tests/XFCFightTracker.Tests.csproj

  repo-file:
    # The repository file is what Dalamud actually reads, so validate it on
    # every push rather than discovering a problem at release time.
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Validate pluginmaster.json
      run: python3 scripts/build-repo.py --check-only --strict --out pluginmaster.json

    - name: Check icon is a real PNG
      run: |
        python3 - <<'EOF'
        import struct, sys
        d = open("images/icon.png", "rb").read()
        if d[:8] != b"\x89PNG\r\n\x1a\n":
            sys.exit("images/icon.png is not a PNG")
        w, h = struct.unpack(">II", d[16:24])
        print(f"icon is a valid {w}x{h} PNG ({len(d)} bytes)")
        if w != h:
            sys.exit("icon should be square")
        EOF
